[project]
name = "myus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "coloredlogs>=15.0.1",
    "dacite>=1.9.2",
    "daphne>=4.2.3",
    "django>=6.1.2",
    "django-cleanup>=9.0.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-import-export>=4.4.2",
    "django-js-asset>=4.2.0",
    "django-ninja>=1.7.1",
    "django-ulid>=0.0.4",
    "gunicorn>=26.2.0",
    "injector>=0.24.0",
    "mysqlclient>=2.3.0",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pyjwt>=2.15.1",
    "python-dateutil>=2.9.0.post0",
    "python-ffmpeg-video-streaming>=0.1.16",
    "stripe>=16.0.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.mypy]
mypy_path = "."                          # ソースルートパスを指定
python_version = "3.15"                  # Pythonのバージョンを指定
strict = true                            # すべての厳密なチェックを有効化
strict_optional = true                   # Optional型の厳密なチェックを有効化
show_error_codes = true                  # エラーコードを表示
check_untyped_defs = true                # 型アノテーションのない関数の中身もチェック
no_implicit_optional = true              # 暗黙的なOptional型を禁止
warn_return_any = true                   # 戻り値の型がAnyの場合に警告
warn_unused_configs = true               # 使用されていない設定がある場合に警告
warn_redundant_casts = true              # 不要な型キャストがある場合に警告
warn_unused_ignores = true               # 不要な型チェック無視の指定がある場合に警告
warn_no_return = true                    # 関数が値を返さない可能性がある場合に警告
warn_unreachable = true                  # 到達不可能なコードがある場合に警告
disallow_any_unimported = true           # インポートされていない型のAnyを禁止
disallow_untyped_defs = true             # 型アノテーションのない関数定義を禁止
disallow_untyped_decorators = true       # 型アノテーションのないデコレータを禁止
disallow_untyped_calls = true            # 型アノテーションのない関数呼び出しを禁止
disallow_incomplete_defs = true          # 一部のパラメータにのみ型アノテーションがある関数を禁止
disable_error_code = ["import-untyped", "var-annotated", "type-abstract", "no-untyped-def", "type-arg"]  # 特定のエラーを無視
plugins = ["mypy_django_plugin.main"]    # Django stubsプラグイン

# 特定のモジュールの設定
[[tool.mypy.overrides]]
module = ["django.*", "api.tests.*"]
ignore_missing_imports = true  # 外部ライブラリの型情報が見つからない場合はエラーを無視

[[tool.mypy.overrides]]
module = ["api.src.adapter.websocket"]
disallow_subclassing_any = false  # channels の WebsocketConsumer は型情報が無いため継承を許可
disallow_any_unimported = false   # 同上

[[tool.mypy.overrides]]
module = ["api.db.admin"]
disallow_subclassing_any = false  # import_export の ImportExportModelAdmin は型情報が無いため継承を許可
disallow_any_unimported = false   # 同上

[[tool.mypy.overrides]]
module = ["api.modules.logger"]
disallow_subclassing_any = false  # coloredlogs の ColoredFormatter は型情報が無いため継承を許可
disallow_any_unimported = false   # 同上

[[tool.mypy.overrides]]
module = ["wmi"]
ignore_missing_imports = true     # Windows でだけ使う任意のライブラリ（GPU の検出）

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
addopts = "--nomigrations"                # マイグレーションは git 管理外のため、テスト用 DB はモデルから直接作る
testpaths = ["api/tests"]

[tool.django-stubs]
django_settings_module = "config.settings.base"


[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["I"]  # isortのみ有効

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2                                        # import後の空行
no-lines-before = ["third-party", "first-party", "local-folder"]  # セクション間の改行なし
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["api", "app", "config"]
