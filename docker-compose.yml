x-app: &app
  restart: always
  build:
    context: .
    dockerfile: Dockerfile
    args:
      UV_SYNC_ARGS: ""
  volumes:
    - ./myus:/code
  env_file:
    - ./myus/envs/django.env
  environment:
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    REDIS_HOST: myus_redis
    REDIS_PORT: "6379"
  depends_on:
    - mysql
    - myus_redis
  networks:
    - myus_network

services:
  myus_backend:
    <<: *app
    container_name: myus_backend
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c 'python manage.py runserver 0.0.0.0:8000 --settings config.settings.local'

  myus_worker:
    <<: *app
    container_name: myus_worker
    command: sh -c 'python manage.py process_payment_events --settings config.settings.local'

  myus_encoder:
    <<: *app
    container_name: myus_encoder
    command: sh -c 'python manage.py encode_videos --settings config.settings.local'

  mysql:
    container_name: myus_mysql
    image: mysql:8.4
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./myus/envs/mysql.env
    ports:
      - "127.0.0.1:3356:3306"
    command: mysqld --innodb_use_native_aio=0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - myus_network

  myus_redis:
    container_name: myus_redis
    image: redis:7-alpine
    restart: always
    env_file:
      - ./myus/envs/redis.env
    ports:
      - "127.0.0.1:6356:6379"
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    networks:
      - myus_network

networks:
  myus_network:
    driver: bridge

volumes:
  mysql_data:
