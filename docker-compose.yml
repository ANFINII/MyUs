services:
  myus_backend:
    container_name: myus_backend
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_SYNC_ARGS: ""
    volumes:
      - ./myus:/code
    env_file:
      - ./myus/envs/django.env
    depends_on:
      - mysql
      - myus_redis
    ports:
      - "8056:8000"
    command: sh -c 'python manage.py runserver 0.0.0.0:8000 --settings config.settings.local'
    networks:
      - myus_network

  mysql:
    container_name: myus_mysql
    image: mysql:8.4
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./myus/envs/mysql.env
    ports:
      - "127.0.0.1:3356:3306"
    command: mysqld --innodb_use_native_aio=0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - myus_network

  myus_redis:
    container_name: myus_redis
    image: redis:7-alpine
    env_file:
      - ./myus/envs/redis.env
    ports:
      - "127.0.0.1:6356:6379"
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    networks:
      - myus_network

networks:
  myus_network:
    driver: bridge

volumes:
  mysql_data:
