name: backend

on:
  pull_request:
    paths:
      - "myus/**"
      - "envs/sample.env"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "myus/**"
      - "envs/sample.env"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: myus
          MYSQL_USER: admin
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: myus

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: myus/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare env
        run: |
          mkdir -p envs
          cp ../envs/sample.env envs/django.env

      - name: mypy
        run: uv run mypy api

      - name: Django check
        run: uv run python manage.py check

      - name: API status check
        run: uv run python manage.py check_api_status

      - name: pytest
        env:
          MYSQL_USER: root
          MYSQL_PASSWORD: password
        run: uv run pytest
