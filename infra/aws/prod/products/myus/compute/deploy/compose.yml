x-app: &app
  image: ${IMAGE}
  restart: always
  env_file:
    - django.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "False"
    MYSQL_ENGINE: django.db.backends.mysql
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    - redis

services:
  backend:
    <<: *app
    mem_limit: 768m
    ports:
      - "80:8000"
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --timeout-keep-alive 65

  worker:
    <<: *app
    mem_limit: 256m
    command: python manage.py process_payment_events

  encoder:
    <<: *app
    cpus: "1.0"
    mem_limit: 640m
    command: python manage.py encode_videos

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 128m
    env_file:
      - django.env
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
